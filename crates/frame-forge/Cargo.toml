[package]
name = "frame-forge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frame-forge"
path = "src/main.rs"

[[bin]]
name = "forge"
path = "src/cli.rs"
required-features = ["cli"]

[dependencies]
# Daemon deps (Linux only)
jfs-common = { path = "../jfs-common" }
tokio = { version = "1", features = ["full"], optional = true }
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
opencv = { version = "0.93", optional = true, features = ["clang-runtime"] }

# Shared deps (cross-platform)
image = "0.25"
lru = "0.18"
anyhow = "1"
gif = "0.14"
webpx = { version = "0.3.4", features = ["animation"] }
enough = "0.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
log = "0.4"
env_logger = "0.11"

[features]
default = ["daemon"]
daemon = ["tokio", "ffmpeg-next"]
opencv = ["dep:opencv"]
cli = []
