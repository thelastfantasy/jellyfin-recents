[package]
name = "webpx"
version = "0.3.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vendored fork of webpx 0.3.4 — exposes preprocessing/sharp_yuv on AnimationEncoder (see CLAUDE.md / git history for why)"

[lib]
name = "webpx"
path = "src/lib.rs"

[features]
animation = []
decode = []
default = ["decode", "encode", "std"]
encode = []
icc = []
std = ["libwebp-sys/std"]
streaming = []

[dependencies]
enough = "0.4.2"
imgref = "1.12.0"
libwebp-sys = "0.14.2"
rgb = "0.8.53"
whereat = "0.1.4"
