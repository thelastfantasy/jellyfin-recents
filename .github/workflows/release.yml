name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Convert semver (1.0.0) to Jellyfin 4-part format (1.0.0.0)
          IFS='.' read -r -a parts <<< "$TAG"
          MAJOR="${parts[0]:-0}"
          MINOR="${parts[1]:-0}"
          PATCH="${parts[2]:-0}"
          BUILD="${parts[3]:-0}"
          VER4="$MAJOR.$MINOR.$PATCH.$BUILD"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver4=$VER4" >> $GITHUB_OUTPUT
          echo "Tag: $TAG  =>  ver4: $VER4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # 精简版 OpenCV（关 GTK/Qt/OpenGL/LAPACK，见 scripts/build-opencv-minimal.sh）—
      # 替代 apt 的桌面版 libopencv-dev，与本地 mise run build-opencv-minimal-linux 用同一脚本，
      # 是 frame-forge release 二进制实际链接、随 .so 闭包打包发布的那份 OpenCV。
      - name: Cache OpenCV-minimal
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /opt/opencv-minimal
          key: opencv-minimal-${{ runner.os }}-${{ hashFiles('scripts/build-opencv-minimal.sh') }}

      - name: Build OpenCV-minimal
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: sudo bash scripts/build-opencv-minimal.sh

      - name: Export OpenCV/clang env for downstream steps
        run: |
          echo "PKG_CONFIG_PATH=/opt/opencv-minimal/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/opencv-minimal/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Install FFmpeg 7.x dev libs
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust
        run: make test-rust

      - name: Test frontend
        run: make test-frontend

      - name: Test C#
        run: make test-csharp

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      - name: Build enhancer
        working-directory: apps/player-enhancer
        run: pnpm run build

      - name: Build seek-preview (Linux x64)
        run: cargo build -p seek-preview --release

      # $ORIGIN/native-linux 让二进制在不设 LD_LIBRARY_PATH 的情况下找到下一步打包的
      # OpenCV .so 闭包；第二条 rpath 指向 jellyfin-dev 容器自带的 ffmpeg lib 目录
      # （该容器已有 ffmpeg .so，故不随包打入）。详见 scripts/build-frame-forge-linux.sh。
      - name: Build frame-forge (Linux x64)
        run: |
          export RUSTFLAGS="-C link-arg=-Wl,-rpath,\$ORIGIN/native-linux -C link-arg=-Wl,-rpath,/usr/lib/jellyfin-ffmpeg/lib"
          cargo build -p frame-forge --release --features opencv

      # 与本地 build-frame-forge-linux.sh 同样的闭包收集逻辑：用 LD_LIBRARY_PATH 让 ldd
      # 能解析到 /opt/opencv-minimal 下的 .so（此时二进制自身的 $ORIGIN rpath 还指向空目录，
      # 无法用来解析依赖，这是先有鸡先有蛋问题，仅靠显式 LD_LIBRARY_PATH 绕开)。
      - name: Bundle frame-forge native OpenCV libs
        run: |
          mkdir -p publish/native-linux
          for lib in $(LD_LIBRARY_PATH=/opt/opencv-minimal/lib:/opt/opencv-minimal/lib/x86_64-linux-gnu ldd target/release/frame-forge | awk '{print $3}' | grep -E '^/opt/opencv-minimal/'); do
            real=$(readlink -f "$lib")
            cp -L "$real" "publish/native-linux/$(basename "$lib")"
          done
          echo "[release] bundled native libs:"
          ls -la publish/native-linux

      - name: Install cross
        run: cargo install cross --locked

      - name: Build Rust binary (Linux x64)
        run: cross build -p poster-gen --release --target x86_64-unknown-linux-gnu -j 2

      - name: Build Rust binary (Windows x64)
        run: cross build -p poster-gen --release --target x86_64-pc-windows-gnu -j 2

      - name: Publish plugin
        run: |
          dotnet publish packages/JellyfinSuite.Plugin/JellyfinSuite.Plugin.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.ver4 }} \
            -o publish/

      - name: Copy Rust binaries to publish dir
        run: |
          cp target/x86_64-unknown-linux-gnu/release/poster-gen publish/poster-gen-linux-x64
          chmod +x publish/poster-gen-linux-x64
          cp target/x86_64-pc-windows-gnu/release/poster-gen.exe publish/poster-gen-win-x64.exe
          cp target/release/seek-preview publish/seek-preview-linux-x64
          chmod +x publish/seek-preview-linux-x64
          cp target/release/frame-forge publish/frame-forge-linux-x64
          chmod +x publish/frame-forge-linux-x64

      - name: Prepare meta.json files
        run: |
          VER4="${{ steps.version.outputs.ver4 }}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)"

          # Base variant — uses the original GUID and name
          jq \
            --arg ver "$VER4" \
            --arg ts "$TIMESTAMP" \
            '.version = $ver | .timestamp = $ts' \
            packages/JellyfinSuite.Plugin/meta.json \
            > publish/meta.json

          # Bundled variant — different GUID and name so Jellyfin treats it as a separate plugin
          jq \
            --arg ver "$VER4" \
            --arg ts "$TIMESTAMP" \
            '.guid = "9f4b2e0a-c736-4d58-b9e1-0a2f3c4d5e6b" | .name = "Jellyfin Suite + Fonts" | .version = $ver | .timestamp = $ts' \
            packages/JellyfinSuite.Plugin/meta.json \
            > publish/meta-bundled.json

      - name: Download bundled fonts
        run: |
          mkdir -p publish/fonts
          # All fonts downloaded as WOFF2 from fontsource npm registry via jsDelivr CDN.
          # fontsource is the official npm packaging of Google Fonts; jsDelivr + npm registry
          # is among the most stable font delivery infrastructure available.
          curl -fL -o publish/fonts/Roboto-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/roboto@5/files/roboto-latin-400-normal.woff2"
          curl -fL -o publish/fonts/RobotoMono-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/roboto-mono@5/files/roboto-mono-latin-400-normal.woff2"
          curl -fL -o publish/fonts/Oswald-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/files/oswald-latin-400-normal.woff2"
          curl -fL -o publish/fonts/PlayfairDisplay-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5/files/playfair-display-latin-400-normal.woff2"
          curl -fL -o publish/fonts/Cinzel-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5/files/cinzel-latin-400-normal.woff2"
          curl -fL -o publish/fonts/Vollkorn-Regular.woff2 \
            "https://cdn.jsdelivr.net/npm/@fontsource/vollkorn@5/files/vollkorn-latin-400-normal.woff2"
          # Validate: WOFF2 magic bytes are "wOF2" = 77 4F 46 32
          for f in publish/fonts/*.woff2; do
            bytes=$(xxd -l 4 "$f" | awk '{print $2$3}')
            echo "$f: $bytes"
            if [[ "$bytes" != "774f4632" ]]; then
              echo "ERROR: $f is not a valid WOFF2 file (magic=$bytes)"
              exit 1
            fi
          done

      - name: Create release zips
        id: zip
        run: |
          VER4="${{ steps.version.outputs.ver4 }}"

          # Base zip — download-on-demand variant
          # native-linux/ 是 frame-forge 链接的精简版 OpenCV .so 闭包（见
          # scripts/build-opencv-minimal.sh + 上面的 Bundle 步骤），必须与
          # frame-forge-linux-x64 同级随包发布，否则其 $ORIGIN/native-linux rpath 找不到依赖。
          ZIPNAME="jellyfin-suite_${VER4}.zip"
          cd publish
          zip -r "../${ZIPNAME}" JellyfinSuite.Plugin.dll meta.json poster-gen-linux-x64 poster-gen-win-x64.exe seek-preview-linux-x64 frame-forge-linux-x64 native-linux
          cd ..
          CHECKSUM="$(md5sum "${ZIPNAME}" | awk '{print $1}')"
          echo "zipname=$ZIPNAME" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Zip: $ZIPNAME  MD5: $CHECKSUM"

          # Bundled zip — separate staging dir so meta.json has the bundled GUID/name
          BUNDLED_ZIPNAME="jellyfin-suite-fonts_${VER4}.zip"
          mkdir -p publish-bundled/fonts
          cp publish/JellyfinSuite.Plugin.dll publish-bundled/
          cp publish/poster-gen-linux-x64 publish-bundled/
          cp publish/poster-gen-win-x64.exe publish-bundled/
          cp publish/seek-preview-linux-x64 publish-bundled/
          cp publish/frame-forge-linux-x64 publish-bundled/
          cp -r publish/native-linux publish-bundled/native-linux
          cp publish/fonts/* publish-bundled/fonts/
          cp publish/meta-bundled.json publish-bundled/meta.json
          cd publish-bundled
          zip -r "../${BUNDLED_ZIPNAME}" .
          cd ..
          BUNDLED_CHECKSUM="$(md5sum "${BUNDLED_ZIPNAME}" | awk '{print $1}')"
          echo "bundled_zipname=$BUNDLED_ZIPNAME" >> $GITHUB_OUTPUT
          echo "bundled_checksum=$BUNDLED_CHECKSUM" >> $GITHUB_OUTPUT
          echo "Bundled zip: $BUNDLED_ZIPNAME  MD5: $BUNDLED_CHECKSUM"

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.zipname }}
            ${{ steps.zip.outputs.bundled_zipname }}
          generate_release_notes: true

      - name: Update manifest.json for GitHub Pages
        run: |
          VER4="${{ steps.version.outputs.ver4 }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHECKSUM="${{ steps.zip.outputs.checksum }}"
          ZIPNAME="${{ steps.zip.outputs.zipname }}"
          BUNDLED_CHECKSUM="${{ steps.zip.outputs.bundled_checksum }}"
          BUNDLED_ZIPNAME="${{ steps.zip.outputs.bundled_zipname }}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${TAG}/${ZIPNAME}"
          BUNDLED_SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${TAG}/${BUNDLED_ZIPNAME}"

          # Prepend new version entry to both plugin entries in the manifest
          jq \
            --argjson base "{
              \"version\": \"$VER4\",
              \"changelog\": \"https://github.com/${{ github.repository }}/releases/tag/v${TAG}\",
              \"targetAbi\": \"10.10.7.0\",
              \"sourceUrl\": \"$SOURCE_URL\",
              \"checksum\": \"$CHECKSUM\",
              \"timestamp\": \"$TIMESTAMP\"
            }" \
            --argjson bundled "{
              \"version\": \"$VER4\",
              \"changelog\": \"https://github.com/${{ github.repository }}/releases/tag/v${TAG}\",
              \"targetAbi\": \"10.10.7.0\",
              \"sourceUrl\": \"$BUNDLED_SOURCE_URL\",
              \"checksum\": \"$BUNDLED_CHECKSUM\",
              \"timestamp\": \"$TIMESTAMP\"
            }" \
            '.[0].versions = [$base] + .[0].versions | .[1].versions = [$bundled] + .[1].versions' \
            manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json

      - name: Stage manifest for GitHub Pages
        run: |
          mkdir -p /tmp/gh-pages
          cp manifest.json /tmp/gh-pages/

      - name: Deploy manifest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/gh-pages
          keep_files: true
          commit_message: "chore: update manifest for v${{ steps.version.outputs.tag }}"
