name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install FFmpeg 7.x and OpenCV dev libs
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libopencv-dev

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Rust
        run: make test-rust

      - name: Test frontend
        run: make test-frontend

      - name: Test C#
        run: make test-csharp

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      - name: Build enhancer
        working-directory: apps/player-enhancer
        run: pnpm run build

      - name: Build plugin
        run: dotnet build packages/JellyfinSuite.Plugin/JellyfinSuite.Plugin.csproj -c Release
