[tools]
"conda:make" = "latest"
"aqua:nektos/act" = "latest"
bun = "latest"
lefthook = "latest"

[tasks.build]
description = "构建前端和插件"
run = "make build"

[tasks.build-poster-gen]
description = "在 Docker 中构建 Rust Linux 二进制"
run = "make build-poster-gen"

[tasks.build-seek-preview]
description = "在 Docker 中编译 seek-preview Linux 二进制（含 FFmpeg 7 dev 库）"
run = "make build-seek-preview"

[tasks.build-frame-forge]
description = "在 Docker 中编译 frame-forge Linux 二进制（含 OpenCV + FFmpeg 7 dev 库）"
run = "make build-frame-forge"

[tasks.check-seek-preview]
description = "在 Docker 中类型检查 seek-preview（快速，不产出二进制）"
run = "make check-seek-preview"

[tasks.check-frame-forge]
description = "在 Docker 中类型检查 frame-forge（快速，不产出二进制）"
run = "make check-frame-forge"

[tasks.check-seek-preview-ps1]
description = "pwsh: Docker 内 check seek-preview"
run = "pwsh -NoProfile -File scripts/check-seek-preview.ps1"

[tasks.check-frame-forge-ps1]
description = "pwsh: Docker 内 check frame-forge"
run = "pwsh -NoProfile -File scripts/check-frame-forge.ps1"

[tasks.update]
description = "构建并部署到本地 Jellyfin 开发容器（完整）"
run = "make update"

[tasks.deploy]
description = "完整部署（构建所有组件并部署到 jellyfin-dev 容器）"
run = "pwsh -NoProfile -File scripts/deploy.ps1"

[tasks.update-quick]
description = "快速部署：仅重建前端+增强器+C#，跳过 Rust 构建"
run = "make update-quick"

[tasks.test]
description = "运行所有测试（Rust + TypeScript + C#）"
run = "make test"

[tasks.test-rust]
description = "运行 Rust 单元测试"
run = "make test-rust"

[tasks.test-frontend]
description = "运行 TypeScript/Vitest 测试"
run = "make test-frontend"

[tasks.test-csharp]
description = "运行 C# xUnit 测试"
run = "make test-csharp"

[tasks.gen-types]
description = "从 C# DTO 反射生成 OpenAPI 3.1 spec，再生成 TypeScript 类型（无需运行容器）"
run = "dotnet run --project packages/JfsSpecGen -- --out packages/api-types/openapi.json && node scripts/gen-plugin-types.mjs --file=packages/api-types/openapi.json"

[tasks.gen-types-from-server]
description = "从运行中的 jellyfin-dev 生成插件 OpenAPI TypeScript 类型（旧流程，需要容器已启动）"
run = "node scripts/gen-plugin-types.mjs"

[tasks.workflow-test]
description = "本地运行 build workflow（需要 Docker）"
run = "make workflow-test"

[tasks.workflow-test-release]
description = "本地运行 release workflow（构建步骤可测；GitHub Release/Pages 步骤因无真实 token 会失败）"
run = "make workflow-test-release"
